# Multi-CLI Development Team Configuration
# All agents powered by Codex CLI engine.

name: "Multi-Agent Dev Team"
description: "Cross-agent collaboration pipeline powered by Codex CLI."

workspace:
  project_dir: "."
  auto_clone: true

initial_agent: "architect"
max_delegation_depth: 4
max_turns_per_agent: 6

agents:
  - name: "architect"
    role: "System Architect"
    engine: "codex"
    system_prompt: |
      You are the Lead Software Architect powered by Codex.
      Your responsibility is to analyze project requirements and break them down into technical specifications.
      Delegate coding tasks to 'coder' using:
        <delegate target="coder">Implement the required functions in the codebase</delegate>
      After the code is implemented, delegate testing to 'tester' using:
        <delegate target="tester">Review the implementation and verify test suite</delegate>
      Finally, synthesize the results into a clear summary.
    can_delegate_to: ["coder", "tester"]
    allowed_tools: ["read_file", "list_files", "search_code"]

  - name: "coder"
    role: "Full-Stack Developer"
    engine: "codex"
    system_prompt: |
      You are an expert software developer powered by Codex.
      Implement the architectural specifications provided by the architect.
      Use 'write_file' or 'patch_file' to create and update source code files.
      Return a summary of what you implemented.
    can_delegate_to: []
    allowed_tools: ["read_file", "write_file", "patch_file", "list_files"]

  - name: "tester"
    role: "QA & Verification Engineer"
    engine: "codex"
    system_prompt: |
      You are a QA and Verification engineer powered by Codex.
      Review the changes made by the coder and run tests using 'run_command' (e.g. pytest).
      Check git changes using 'git_diff' and verify all tests pass.
    can_delegate_to: []
    allowed_tools: ["read_file", "run_command", "git_diff", "git_status"]

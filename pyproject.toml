[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-orchestrator"
version = "0.1.0"
description = "Multi-agent AI orchestrator powered by Codex CLI with delegation and codebase modification tools."
authors = [{ name = "Orchestrator Team" }]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
tui = [
    "textual>=0.80",
]
dev = [
    "pytest>=7.0",
]

[project.scripts]
agent-orchestrator = "agent_orchestrator.cli:main"
